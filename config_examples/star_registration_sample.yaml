schema_version: 1
target_folder: ./rawfiles/2024GEMINI_AIRCRAFT
output_folder: ./candidates/star_registration
debug_folder: ./debug_masks/star_registration
progress_file: ./candidates/star_registration/progress.json

# Sky ROI for this sequence in 2x2-binned image coordinates.
roi_polygon: [[125, 85], [2440, 85], [2440, 1230], [125, 1230]]
params:
  diff_threshold: 9
  min_area: 3
  min_aspect_ratio: 3.0
  hough_threshold: 10
  hough_min_line_length: 15
  hough_max_line_gap: 5
  min_line_score: 30.0

input_loader_name: raw
detector_name: hough
num_workers: 2
batch_size: 4
hooks:
  - name: star_registration
  - name: aircraft_trail
