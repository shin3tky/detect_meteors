[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "detect-meteors-region-experiment"
version = "0.11.0"
requires-python = ">=3.12,<3.15"
dependencies = ["detect-meteors>=1.6.13"]

[project.entry-points."detect_meteors.detector"]
region = "region_detector:RegionDetector"
lsd = "lsd_detector:LsdDetector"
radon = "radon_detector:RadonDetector"
ridge = "ridge_detector:RidgeDetector"
beamlet = "beamlet_detector:BeamletDetector"
frt = "frt_detector:FrtDetector"

[project.entry-points."detect_meteors.output"]
pair_report = "pair_report:PairReportHandler"

[tool.setuptools]
py-modules = [
    "region_detector", "lsd_detector", "radon_detector", "ridge_detector",
    "beamlet_detector", "frt_detector", "pair_report", "trail_measurement",
]
