name: Build release distributions

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example, 1.6.12)"
        required: true
        type: string
      commit_sha:
        description: "Full SHA of the commit the tag must point to"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-slim
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      EXPECTED_SHA: ${{ inputs.commit_sha }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Confirm the tag and export its source
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Enter a release tag in X.Y.Z format."
            exit 1
          fi
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Enter the full 40-character commit SHA."
            exit 1
          fi

          git fetch --depth=1 --no-tags origin "refs/tags/$RELEASE_TAG"
          tag_commit=$(git rev-parse --verify 'FETCH_HEAD^{commit}')
          expected_commit=$(printf '%s' "$EXPECTED_SHA" | tr 'A-F' 'a-f')
          if [[ "$tag_commit" != "$expected_commit" ]]; then
            echo "::error::Tag $RELEASE_TAG points to $tag_commit, expected $EXPECTED_SHA."
            exit 1
          fi

          mkdir "$RUNNER_TEMP/release-source"
          git archive --format=tar "$tag_commit" |
            TAR_OPTIONS='' tar -xf - -C "$RUNNER_TEMP/release-source"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install Python 3.12 and 3.13
        run: uv python install 3.12 3.13

      - name: Build distributions and generate SHA256SUMS
        shell: bash
        run: |
          cd "$RUNNER_TEMP/release-source" || exit 1
          uv lock --check --python 3.12
          uv build --python 3.12 --out-dir "$RUNNER_TEMP/release-dist"

          cd "$RUNNER_TEMP/release-dist" || exit 1
          wheel="detect_meteors-$RELEASE_TAG-py3-none-any.whl"
          sdist="detect_meteors-$RELEASE_TAG.tar.gz"
          shopt -s nullglob dotglob
          files=(*.whl *.tar.gz)
          if [[ "${#files[@]}" -ne 2 || ! -f "$wheel" || ! -f "$sdist" ]]; then
            echo "::error::Expected exactly $wheel and $sdist."
            exit 1
          fi
          sha256sum "$wheel" "$sdist" > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Verify both distributions on both Python versions
        shell: bash
        run: bash .github/scripts/verify-release-install.sh "$RELEASE_TAG" "$RUNNER_TEMP/release-dist"

      - name: Save the verified distributions
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: detect-meteors-${{ inputs.tag }}-${{ inputs.commit_sha }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-dist/detect_meteors-${{ inputs.tag }}-py3-none-any.whl
            ${{ runner.temp }}/release-dist/detect_meteors-${{ inputs.tag }}.tar.gz
            ${{ runner.temp }}/release-dist/SHA256SUMS
          if-no-files-found: error

      - name: Summarize release verification
        shell: bash
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          {
            echo '### Verified release distributions'
            printf '\n- Tag: %s\n- Commit: %s\n' "$RELEASE_TAG" "$EXPECTED_SHA"
            echo '- Wheel and source distribution passed installation, dependency and CLI checks on Python 3.12 and 3.13.'
            echo '- Both distributions matched SHA256SUMS.'
            printf -- '- [Download the three files](%s) for manual publication.\n' "$ARTIFACT_URL"
          } >> "$GITHUB_STEP_SUMMARY"
